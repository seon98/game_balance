{% extends 'base.html' %}

{% block title %}비밀번호 재설정 - 양자택일{% endblock %}

{% block content %}
<section class="auth-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="auth-icon mx-auto mb-3"><i class="bi bi-key"></i></div>
              <h1 class="h3 fw-black mb-2">비밀번호 재설정</h1>
              <p class="text-muted small mb-0">가입한 이메일로 안전한 재설정 링크를 보내드립니다.</p>
            </div>
            <form method="post" novalidate>
              {% csrf_token %}
              <div class="mb-3">
                <label for="{{ form.email.id_for_label }}" class="form-label fw-bold small">이메일</label>
                <input
                  type="email"
                  name="email"
                  id="{{ form.email.id_for_label }}"
                  class="form-control"
                  autocomplete="email"
                  required
                >
                {% for error in form.email.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-bold py-2">재설정 링크 보내기</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

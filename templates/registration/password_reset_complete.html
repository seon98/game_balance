{% extends 'base.html' %}

{% block title %}비밀번호 변경 완료 - 양자택일{% endblock %}

{% block content %}
<section class="auth-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-5 text-center">
            <div class="auth-icon mx-auto mb-3"><i class="bi bi-shield-check"></i></div>
            <h1 class="h3 fw-black">비밀번호가 변경되었습니다</h1>
            <p class="text-muted">새 비밀번호로 로그인해 선택 기록을 이어서 확인하세요.</p>
            <a href="{% url 'games:login' %}" class="btn btn-primary fw-bold px-4">로그인</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

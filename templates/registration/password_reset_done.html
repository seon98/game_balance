{% extends 'base.html' %}

{% block title %}재설정 메일 발송 - 양자택일{% endblock %}

{% block content %}
<section class="auth-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-5 text-center">
            <div class="auth-icon mx-auto mb-3"><i class="bi bi-envelope-check"></i></div>
            <h1 class="h3 fw-black">이메일을 확인해주세요</h1>
            <p class="text-muted">가입된 이메일이라면 비밀번호 재설정 링크를 보냈습니다.</p>
            <a href="{% url 'games:login' %}" class="btn btn-outline-primary fw-bold">로그인으로 돌아가기</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
